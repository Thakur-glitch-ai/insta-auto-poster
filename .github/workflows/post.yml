name: Instagram Auto Poster

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests Pillow
        
      - name: Run script
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          IMGBB_KEY: ${{ secrets.IMGBB_KEY }}
        run: python post.py
